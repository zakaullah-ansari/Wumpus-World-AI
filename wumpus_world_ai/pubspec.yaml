name: wumpus_world_ai
description: >
  A knowledge-based-agent Wumpus World simulation built for a
  Flutter + Dart + Firebase + AI Agent reasoning workshop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # REST API Integration (Syllabus #4) – no native ML SDK required.
  http: ^1.2.1

  # Firebase Auth + Firestore (Syllabus #4)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
